<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - SIP-BANTU TANI</title>
    <style>
        /* Menggunakan style dasar yang sama dengan temanmu */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #ffeb3b; display: flex; justify-content: center; align-items: center; min-height: 100vh; }

        .phone-container {
            width: 100%; max-width: 400px; height: 850px; max-height: 90vh;
            background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        /* Header Hijau */
        .header { background-color: #2e7d32; color: white; padding: 30px 20px; display: flex; align-items: center; gap: 15px; }
        .back-btn { font-size: 20px; cursor: pointer; }

        /* Konten */
        .content { padding: 40px 20px; display: flex; flex-direction: column; align-items: center; flex-grow: 1; }
        .icon-box { font-size: 60px; margin-bottom: 20px; color: #2e7d32; }
        
        input { 
            width: 100%; padding: 15px; margin: 10px 0; border: 1px solid #ccc; 
            border-radius: 10px; font-size: 16px; 
        }

        .btn-green { 
            background-color: #00e676; color: white; border: none; padding: 15px; 
            width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; margin-top: 20px;
        }

        .otp-container { display: flex; gap: 10px; justify-content: center; margin: 20px 0; }
        .otp-box { width: 50px; height: 50px; border: 2px solid #2e7d32; border-radius: 8px; text-align: center; font-size: 20px; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="back-btn">←</div>
            <h2 id="title">Lupa Password</h2>
        </div>

        <div class="content" id="view-1">
            <div class="icon-box">🔒</div>
            <p style="text-align: center; margin-bottom: 20px;">Masukkan Nomor Telepon Untuk mereset password anda</p>
            <input type="text" placeholder="Masukkan No Telepon">
            <button class="btn-green" onclick="alert('Kode dikirim!')">Kirim Kode</button>
        </div>
    </div>

</body>
</html>
