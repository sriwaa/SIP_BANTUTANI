<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi OTP - SIP-BANTU TANI</title>
    <style>
        body { background-color: #ffeb3b; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        
        .phone-container {
            width: 375px; height: 750px; background-color: #1b5e20;
            border-radius: 40px; position: relative; overflow: hidden; display: flex; flex-direction: column;
        }

        .header { padding: 40px 20px; color: white; display: flex; align-items: center; gap: 15px; }
        .back-icon { font-size: 24px; cursor: pointer; }
        .title { font-size: 22px; font-weight: bold; }

        .white-card {
            background: white; flex-grow: 1; border-top-left-radius: 40px; border-top-right-radius: 40px;
            display: flex; flex-direction: column; align-items: center; padding-top: 50px;
        }

        .icon-lock { font-size: 60px; margin-bottom: 20px; }
        .label-text { font-size: 16px; margin-bottom: 25px; color: #333; text-align: center; }

        .otp-container { display: flex; gap: 10px; margin-bottom: 10px; }
        .otp-box { 
            width: 50px; height: 55px; border: 2px solid #2e7d32; border-radius: 12px; 
            text-align: center; font-size: 24px; font-weight: bold; color: #1b5e20;
        }

        .resend-text { font-size: 12px; color: #666; margin-bottom: 30px; text-align: center; }
        .resend-text span { color: #2e7d32; font-weight: bold; cursor: pointer; }
        
        .btn-verify {
            width: 80%; padding: 15px; background: #00ff37; border: none; border-radius: 12px;
            color: white; font-size: 18px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="header">
            <div class="back-icon" onclick="history.back()">←</div>
            <div class="title">Kode OTP</div>
        </div>

        <div class="white-card">
            <div class="icon-lock">🔒</div>
            <div class="label-text">Masukan kode OTP yang dikirim</div>
            
            <div class="otp-container">
                <input type="number" class="otp-box" maxlength="1" oninput="moveNext(this, 'n2')">
                <input type="number" class="otp-box" id="n2" maxlength="1" oninput="moveNext(this, 'n3')">
                <input type="number" class="otp-box" id="n3" maxlength="1" oninput="moveNext(this, 'n4')">
                <input type="number" class="otp-box" id="n4" maxlength="1">
            </div>

            <div class="resend-text">Belum menerima kode?<br><span onclick="alert('Kode dikirim ulang!')">Kirim ulang kode</span></div>
            
            <button class="btn-verify" onclick="verifikasiOTP()">Verifikasi</button>
        </div>
    </div>

    <script>
        // Otomatis pindah kotak
        function moveNext(current, nextFieldID) {
            if (current.value.length >= 1) {
                document.getElementById(nextFieldID).focus();
            }
        }

        // Logika Verifikasi
        function verifikasiOTP() {
            const inputs = document.querySelectorAll('.otp-box');
            let otp = "";
            inputs.forEach(input => otp += input.value);

            if (otp.length < 4) {
                alert("Mohon masukkan 4 digit kode OTP!");
            } else {
                // Contoh: Kode benar adalah 1234
                if (otp === "1234") {
                    alert("Verifikasi Berhasil!");
                } else {
                    alert("Kode OTP salah, silakan coba lagi.");
                }
            }
        }
    </script>
</body>
</html>
