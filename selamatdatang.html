<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang - SIP-BANTU TANI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: #fbc02d; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 15px; }

        .phone-container {
            width: 100%; max-width: 412px; height: 860px; max-height: 90vh;
            background: white;
            border-radius: 36px; box-shadow: 0 20px 45px rgba(0,0,0,0.35);
            display: flex; flex-direction: column; overflow: hidden; position: relative;
        }

        .hero-area {
            width: 100%; height: 45%;
            background-image: url('bg-sawah.jpeg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center;
            border-bottom-left-radius: 40px; border-bottom-right-radius: 40px;
        }

        .logo-bg {
            width: 160px; height: 160px; background: white; border-radius: 50%;
            display: flex; justify-content: center; align-items: center;
            border: 4px solid #13a851; box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .logo-img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }

        .content-area {
            padding: 40px 30px; display: flex; flex-direction: column; align-items: center; text-align: center;
        }

        .welcome-title { color: #1b5e20; font-size: 20px; font-weight: 800; margin-bottom: 10px; }
        .welcome-desc { color: #666; font-size: 14px; margin-bottom: 40px; line-height: 1.5; }

        .btn {
            width: 100%; height: 50px; border: none; border-radius: 14px;
            font-size: 16px; font-weight: bold; cursor: pointer; margin-bottom: 15px;
            transition: transform 0.2s;
        }
        .btn-login { background: #00ff37; color: white; }
        .btn-create { background: #13a851; color: white; }
        .btn:active { transform: scale(0.98); }

        /* Style Baru untuk Tombol Back Kecil */
        .btn-back {
            background: none;
            border: none;
            color: #666;
            font-size: 14px;
            cursor: pointer;
            margin-top: 10px;
            align-self: flex-start; /* Mengatur ke sisi kiri */
            padding: 5px 0;
            text-decoration: underline;
        }
        .btn-back:hover { color: #1b5e20; }
    </style>
</head>
<body>

    <div class="phone-container">
        <div class="hero-area">
            <div class="logo-bg">
                <img src="logo.png" alt="Logo SIP-BANTU TANI" class="logo-img">
            </div>
        </div>

        <div class="content-area">
            <h1 class="welcome-title">Selamat Datang di SIP-BANTU TANI</h1>
            <p class="welcome-desc">Portal Resmi Bantuan Pertanian<br>Dapatkan informasi program bantuan pemerintah terbaru untuk memajukan pertanian Anda.</p>
            
            <button class="btn btn-login" onclick="window.location.href='login.html'">Login</button>
            <button class="btn btn-create" onclick="window.location.href='register.html'">Create Account</button>
            
            <button class="btn-back" onclick="window.location.href='1_awalan.html'">
                &larr; Back
            </button>
        </div>
    </div>

</body>
</html>
